name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: huanleya
          template: classic
          base: "" # 去除基础信息
          config_timezone: Asia/Shanghai
          config_theme: tokyonight # 暗黑主题
          
          # 1. 语言占比插件 (新增)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage # 显示字节数和百分比
          plugin_languages_limit: 8 # 最多显示 8 种主要语言
          plugin_languages_ignored: html, css # 忽略纯标记语言以提高代码含金量
          
          # 2. 3D 日历插件
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 3. 代码习惯插件
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
